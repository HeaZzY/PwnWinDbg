[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pwnwindbg"
version = "0.1.0"
description = "A pwndbg-style debugger for Windows userland, built from scratch on the Windows Debug API."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "heazzy"},
]
keywords = ["debugger", "windows", "pwndbg", "exploit", "reverse-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pywin32>=306",
    "capstone>=5.0",
    "pefile>=2023.2.7",
    "rich>=13.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
asm = ["keystone-engine>=0.9.2"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
pwnwindbg = "pwnwindbg.__main__:main"

[project.urls]
Homepage = "https://github.com/heazzy/pwnWinDbg"
Repository = "https://github.com/heazzy/pwnWinDbg.git"
Issues = "https://github.com/heazzy/pwnWinDbg/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pwnwindbg*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
